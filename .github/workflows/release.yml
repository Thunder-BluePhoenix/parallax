name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-go-worker:
    name: Build Go sidecar
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: darwin-x86_64
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: darwin-aarch64
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src-go/go.sum
      - name: Build worker
        working-directory: src-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../src-tauri/binaries/parallax-worker-${{ matrix.target }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.target }}
          path: src-tauri/binaries/parallax-worker-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: Build & Release — ${{ matrix.platform.name }}
    needs: build-go-worker
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            worker-target: darwin-aarch64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            worker-target: darwin-x86_64
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            worker-target: linux-x86_64
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            worker-target: windows-x86_64

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Download Go worker
        uses: actions/download-artifact@v4
        with:
          name: worker-${{ matrix.platform.worker-target }}
          path: src-tauri/binaries/

      - name: Install npm dependencies
        run: npm ci

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parallax ${{ github.ref_name }}"
          releaseBody: |
            ## What's Changed
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}
