[package]
name = "parallax"
version = "0.1.0"
description = "Parallax - Local-First API Super-Client"
authors = ["bluephoenix"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "parallax_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "parallax"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "multipart", "stream", "rustls-tls", "http2", "cookies"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
regex = "1"
url = "2"
mime_guess = "2"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
futures = "0.3"
walkdir = "2"
percent-encoding = "2.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
